<!doctype html>
<html>
<head><meta charset="utf-8"><title>WebGL test</title></head>
<body style="margin:0;background:#222">
<canvas id="c" width="960" height="540" style="display:block"></canvas>
<script>
function report(s){ try { dump('WEBGL_RESULT ' + s + '\n'); } catch(e){} document.title = s; }
(function(){
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  if (!gl) { document.body.style.background='#ff0000'; report('FAIL_NO_CONTEXT'); return; }
  var vs = 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
  var fs = 'precision mediump float; uniform float t; void main(){ gl_FragColor=vec4(0.1+0.5*abs(sin(t)),0.6+0.3*cos(t*0.7),0.4+0.5*sin(t*1.3),1.0); }';
  function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);return o;}
  var prog=gl.createProgram();
  gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  var buf=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,buf);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1, 1,-1, -1,1, 1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var tloc=gl.getUniformLocation(prog,'t');
  var frames=0;
  function frame(t){ gl.uniform1f(tloc,t/1000); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLE_STRIP,0,4); frames++; if(frames==3) report('OK ' + gl.getParameter(gl.RENDERER) + ' ' + gl.getParameter(gl.VERSION)); requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
