<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>WebGL stress</title>
<style>
  html,body{margin:0;height:100%;background:#222;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Lokal WebGL-stress-side: kontinuerlig rAF-animation, fuld canvas,
// FPS via dump(), justerbar opløsning. Ingen reklamer/Unity/netværk.
// Parametre (URL-query): scale (0.5|1|1.5), tiles (grid-tæthed), tex (0/1).
//   file:///usr/local/lib/firefox-webgl/webgl_stress.html?scale=1&tiles=32&tex=0
function report(s){ try{ dump('STRESS ' + s + '\n'); }catch(e){} document.title = s; }
(function(){
  var q = new URLSearchParams(location.search);
  var scale = parseFloat(q.get('scale') || '1') || 1;
  var tiles = parseInt(q.get('tiles') || '32', 10) || 32;
  var useTex = q.get('tex') !== '0';
  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
  if (!gl) { report('FAIL_NO_CONTEXT'); return; }
  report('OK ' + gl.getParameter(gl.RENDERER) + ' / ' + gl.getParameter(gl.VERSION) +
         ' scale=' + scale + ' tiles=' + tiles + ' tex=' + useTex);

  canvas.addEventListener('webglcontextlost', function(e){ e.preventDefault(); report('CONTEXT_LOST'); }, false);
  canvas.addEventListener('webglcontextrestored', function(){ report('CONTEXT_RESTORED'); }, false);

  var vs = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  var fs = [
    'precision mediump float;',
    'uniform float t;',
    'uniform vec2 u_res;',
    'uniform float u_tiles;',
    'void main(){',
    '  vec2 uv = gl_FragCoord.xy / u_res;',
    '  vec2 c = uv * 2.0 - 1.0;',
    '  float a = sin(c.x * 4.0 + t) * cos(c.y * 3.0 - t * 0.7);',
    '  float b = sin(length(c) * 6.0 - t * 1.2);',
    '  float v = a * 0.5 + b * 0.5;',
    '  vec3 col = 0.5 + 0.5 * cos(vec3(1.0, 1.4, 1.8) + v * 3.0 + t * 0.4);',
    '  vec2 g = abs(fract(uv * u_tiles) - 0.5);',
    '  float line = 1.0 - smoothstep(0.0, 0.05, min(g.x, g.y));',
    '  col = mix(col, vec3(1.0), line * 0.35);',
    '  gl_FragColor = vec4(col, 1.0);',
    '}'
  ].join('\n');
  function sh(t, s){
    var o = gl.createShader(t);
    gl.shaderSource(o, s);
    gl.compileShader(o);
    if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) { report('SHADER_FAIL ' + gl.getShaderInfoLog(o)); return null; }
    return o;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { report('LINK_FAIL ' + gl.getProgramInfoLog(prog)); return; }
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  var ploc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(ploc);
  gl.vertexAttribPointer(ploc, 2, gl.FLOAT, false, 0, 0);
  var tloc = gl.getUniformLocation(prog, 't');
  var rloc = gl.getUniformLocation(prog, 'u_res');
  var gsLoc = gl.getUniformLocation(prog, 'u_tiles');

  // Valgfri tekstur: lille RGBA-støj uploades hver frame (spil-lignende belastning).
  var tex = null, texData = null, texSize = 128;
  if (useTex) {
    tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
    texData = new Uint8Array(texSize * texSize * 4);
    var texLoc = gl.getUniformLocation(prog, 'u_tex');
    gl.uniform1i(texLoc, 0);
  }

  function resize(){
    var dpr = window.devicePixelRatio || 1;
    var w = Math.max(1, Math.round(window.innerWidth * scale * dpr));
    var h = Math.max(1, Math.round(window.innerHeight * scale * dpr));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    gl.viewport(0, 0, w, h);
    report('SIZE ' + w + 'x' + h);
  }
  window.addEventListener('resize', resize);

  var frames = 0, lastDump = 0, seed = 12345;
  function frame(now){
    var t = now / 1000;
    gl.uniform1f(tloc, t);
    gl.uniform2f(rloc, canvas.width, canvas.height);
    gl.uniform1f(gsLoc, tiles);
    if (useTex) {
      seed = (t * 997) | 0;
      for (var i = 0, s = texSize * texSize * 4; i < s; i += 4) {
        seed = (seed * 1664525 + 1013904223) & 0x7fffffff;
        texData[i]     = seed & 0xff;
        texData[i + 1] = (seed >> 7) & 0xff;
        texData[i + 2] = (seed >> 14) & 0xff;
        texData[i + 3] = 255;
      }
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, texSize, texSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, texData);
    }
    gl.clearColor(0, 0, 0, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    frames++;
    if (now - lastDump >= 5000) {
      var fps = frames * 1000 / (now - lastDump);
      report('FPS ' + fps.toFixed(1) + ' frames=' + frames + ' size=' + canvas.width + 'x' + canvas.height);
      frames = 0; lastDump = now;
    }
    requestAnimationFrame(frame);
  }
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
