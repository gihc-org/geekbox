<!doctype html>
<html>
<head><meta charset="utf-8"><title>MRT/FBO-test</title></head>
<body style="margin:0;background:#222">
<h1 style="color:#fff">WebGL2 MRT/FBO-test (skal skrive grøn+blå i FBO)</h1>
<canvas id="c" width="320" height="200"></canvas>
<script>
function report(s){ try{ dump('MRT ' + s + '\n'); }catch(e){} document.title = s; }
var cv = document.getElementById('c');
var gl = cv.getContext('webgl2');
if (!gl) { report('INGEN WEBGL2'); }
else {
    report('webgl2 OK ' + gl.getParameter(gl.VERSION));
    /* FBO med 2 farve-attachments + dybde */
    var fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    var tex0 = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex0);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 320, 200, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex0, 0);
    var tex1 = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex1);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 320, 200, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT1, gl.TEXTURE_2D, tex1, 0);
    var depth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, depth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT16, 320, 200);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, depth);
    var st = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    report('FBO-status: ' + st.toString(16) + ' (0x8CD5=komplet)');
    gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
    /* shader der skriver til begge outputs */
    function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);
        if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){report('SHADER-FEJL: '+gl.getShaderInfoLog(o));}
        return o;}
    var pr = gl.createProgram();
    gl.attachShader(pr, sh(gl.VERTEX_SHADER, '#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}'));
    gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, '#version 300 es\nprecision highp float;\nlayout(location=0) out vec4 c0;layout(location=1) out vec4 c1;void main(){c0=vec4(0.0,1.0,0.0,1.0);c1=vec4(0.0,0.0,1.0,1.0);}'));
    gl.linkProgram(pr);
    report('link=' + gl.getProgramParameter(pr, gl.LINK_STATUS));
    gl.useProgram(pr);
    var b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
    var l = gl.getAttribLocation(pr, 'p');
    gl.enableVertexAttribArray(l);
    gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
    gl.clearColor(1,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    report('drawBuffers-fejl efter draw: ' + gl.getError().toString(16));
    /* læs attachment 0 tilbage */
    gl.readBuffer(gl.COLOR_ATTACHMENT0);
    var px0 = new Uint8Array(4);
    gl.readPixels(1,1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px0);
    gl.readBuffer(gl.COLOR_ATTACHMENT1);
    var px1 = new Uint8Array(4);
    gl.readPixels(1,1,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px1);
    report('ATT0=' + px0[0]+','+px0[1]+','+px0[2] + ' ATT1=' + px1[0]+','+px1[1]+','+px1[2]);
}
</script>
</body>
</html>
