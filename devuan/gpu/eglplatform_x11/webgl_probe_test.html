<!doctype html>
<html>
<head><meta charset="utf-8"><title>SDK-probe-test</title></head>
<body>
<script>
function report(s){ try{ dump('PROBE ' + s + '\n'); }catch(e){} document.title = s; }

/* Efterligner Poki-SDK'ens bi()-probe + playerfit-check */
var canvas = document.createElement("canvas");
var ctx = null;
try {
    ctx = canvas.getContext("webgl2", { failIfMajorPerformanceCaveat: true });
} catch (e) { report("webgl2(failIfMajor) THROW " + e); }
if (!ctx) {
    try { ctx = canvas.getContext("webgl", { failIfMajorPerformanceCaveat: true }); }
    catch (e) { report("webgl(failIfMajor) THROW " + e); }
}
if (!ctx) {
    try { ctx = canvas.getContext("webgl"); } catch (e) { report("webgl THROW " + e); }
}
if (!ctx) {
    report("ALLE KONTEKSTER NULL -> 'WebGL ikke understøttet'");
} else {
    report("KONTEKST OK: " + ctx.getParameter(ctx.RENDERER));
    /* SDK: læs renderer via WEBGL_debug_renderer_info */
    var ext = ctx.getExtension("WEBGL_debug_renderer_info");
    if (ext) report("UNMASKED: " + ctx.getParameter(ext.UNMASKED_RENDERER_WEBGL));
    /* SDK: bi() — kald loseContext på probe-konteksten */
    var lost = 0, restored = 0;
    canvas.addEventListener("webglcontextlost", function(e){ lost++; report("CTXLOST event (lost=" + lost + ") statusMessage='" + (e.statusMessage||"") + "'"); });
    canvas.addEventListener("webglcontextrestored", function(e){ restored++; report("CTXRESTORED event (restored=" + restored + ")"); });
    try {
        var le = ctx.getExtension("WEBGL_lose_context");
        if (le) { report("kalder loseContext()"); le.loseContext(); }
        else report("WEBGL_lose_context = NULL");
    } catch (e) { report("loseContext THROW " + e); }
    setTimeout(function(){
        report("efter 3s: lost=" + lost + " restored=" + restored +
               " ctx.isContextLost()=" + ctx.isContextLost() +
               " canvas.getContext('webgl2') igen=" + (!!canvas.getContext("webgl2")));
        /* Kan en NY kontekst RENDERE efter tabet? (1.5-genopretningstest) */
        var c2 = document.createElement("canvas");
        var gl2 = c2.getContext("webgl2") || c2.getContext("webgl");
        if (!gl2) { report("NY KONTEKST NULL"); return; }
        try {
            var vs = 'attribute vec2 p; void main(){ gl_Position=vec4(p,0.0,1.0); }';
            var fs = 'precision mediump float; void main(){ gl_FragColor=vec4(0.0,1.0,0.0,1.0); }';
            function sh(t,s){var o=gl2.createShader(t);gl2.shaderSource(o,s);gl2.compileShader(o);return o;}
            var pr=gl2.createProgram();
            gl2.attachShader(pr,sh(gl2.VERTEX_SHADER,vs));
            gl2.attachShader(pr,sh(gl2.FRAGMENT_SHADER,fs));
            gl2.linkProgram(pr); gl2.useProgram(pr);
            var b=gl2.createBuffer(); gl2.bindBuffer(gl2.ARRAY_BUFFER,b);
            gl2.bufferData(gl2.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl2.STATIC_DRAW);
            var l=gl2.getAttribLocation(pr,'p'); gl2.enableVertexAttribArray(l);
            gl2.vertexAttribPointer(l,2,gl2.FLOAT,false,0,0);
            gl2.clearColor(0,0,0,1); gl2.clear(gl2.COLOR_BUFFER_BIT);
            gl2.drawArrays(gl2.TRIANGLE_STRIP,0,4);
            var px=new Uint8Array(4);
            gl2.readPixels(1,1,1,1,gl2.RGBA,gl2.UNSIGNED_BYTE,px);
            report("NY KONTEKST RENDERER: pixel=" + px[0]+","+px[1]+","+px[2]+","+px[3] +
                   " glError=" + gl2.getError().toString(16));
        } catch(e) { report("NY KONTEKST RENDER THROW: " + e); }
    }, 3000);
}
</script>
</body>
</html>
